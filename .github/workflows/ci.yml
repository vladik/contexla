name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Application SDK
            path: applications/sdk
          - name: Digital Estate Assessment
            path: applications/digital_estate_assessment
            package: true
          - name: Capability SDK
            path: capabilities/sdk
          - name: Bundled Capabilities
            path: capabilities/bundled
          - name: Native Processors
            path: processors/native
          - name: Integration SDK
            path: integrations/sdk
          - name: Drupal Integration
            path: integrations/drupal
          - name: Shared UI
            path: ui/contexla_ui
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          elixir-version: "1.20.2"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: Build trusted Application package
        if: matrix.package == true
        run: mix contexla.application.package

  platform:
    name: Platform with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contexla
          POSTGRES_PASSWORD: contexla_dev
          POSTGRES_DB: contexla_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contexla -d contexla_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          elixir-version: "1.20.2"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix assets.setup
      - run: mix assets.deploy
