services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: contexla
      POSTGRES_PASSWORD: contexla_dev
      POSTGRES_DB: contexla_dev
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - contexla_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexla -d contexla_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  contexla_postgres:
